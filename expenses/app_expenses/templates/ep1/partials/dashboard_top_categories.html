{% load humanize %} {% if top_categories %}
<div class="list-group list-group-flush rounded-bottom-4">
  {% for cat in top_categories %}
  <div
    class="list-group-item d-flex justify-content-between align-items-center px-4 py-3 bg-transparent"
  >
    <span class="badge category-badge px-3 py-2 rounded-pill shadow-sm">
      {{ cat.category__name|default:"Không xác định" }}
    </span>
    <span class="fw-bold text-main">
      {{ cat.total|floatformat:0|intcomma }} ₫
    </span>
  </div>
  {% endfor %}
</div>
{% else %}
<div class="empty-state py-4">
  <i class="fas fa-folder-open empty-state-icon fs-2 mb-2 d-block opacity-50" aria-hidden="true"></i>
  <p class="empty-state-title small mb-1">Chưa có chi tiêu theo danh mục</p>
  <p class="text-muted small mb-0">Thêm khoản chi tiêu đầu tiên để xem thống kê danh mục.</p>
</div>
{% endif %}
