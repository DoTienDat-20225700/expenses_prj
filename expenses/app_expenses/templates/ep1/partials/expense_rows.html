{% load humanize %} {% for expense in expenses %}
<tr>
  <td class="ps-3 fw-bold text-primary">
    {{ expense.amount|floatformat:0|intcomma:0 }} ₫
  </td>
  <td class="text-muted">
    {{ expense.description|truncatechars:40|default:"--" }}
  </td>
  <td>
    <span class="badge px-3 py-2 rounded-pill category-badge">
      {{ expense.category.name|default:"Chưa phân loại" }}
    </span>
  </td>
  <td class="text-muted">{{ expense.date|date:"d/m/Y" }}</td>
  <td class="text-center">
    <div class="btn-group">
      <a
        href="{% url 'ep1:edit_ep1' expense.id %}?next={{ next_url|urlencode }}#list-section"
        class="btn btn-sm btn-outline-primary border-0"
        data-bs-toggle="tooltip"
        title="Sửa"
      >
        <i class="fas fa-pen"></i>
      </a>

      <a
        href="{% url 'ep1:delete_ep1' expense.id %}?next={{ next_url|urlencode }}#list-section"
        class="btn btn-sm btn-outline-danger border-0"
        data-bs-toggle="tooltip"
        title="Xóa"
      >
        <i class="fas fa-trash"></i>
      </a>
    </div>
  </td>
</tr>
{% empty %}
<tr>
  <td colspan="5" class="text-center py-5 text-muted">
    <div class="mb-3">
      <i class="fas fa-folder-open fa-3x opacity-25"></i>
    </div>
    <p class="mb-0">Chưa có dữ liệu chi tiêu nào.</p>
  </td>
</tr>
{% endfor %}
